<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>EQ2 Timers</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Roboto+Condensed:wght@400;600;700&display=swap" rel="stylesheet">
    <link href="common.css" rel="stylesheet">
    <style>
           /* Matches dps-meter.html's ledger treatment - border/gradient/shadow on the panel,
        Cinzel for labels, brass accents. Bars themselves keep a Cactbot-style minimal chrome
        (solid colored bars, no per-bar border/gradient), just using this project's own color
        language instead of a generic flat blue. */
           #panel {
               width: 320px;
               display: flex;
               flex-direction: column;
               gap: 4px;
               padding: 10px;
               background: linear-gradient(180deg, rgba(26,20,15,0.92), rgba(20,15,11,0.92));
               border: 1px solid var(--brass);
               border-radius: 6px;
               box-shadow: inset 0 0 0 1px rgba(0,0,0,0.4), 0 4px 16px rgba(0,0,0,0.5);
           }

           .bar {
               position: relative;
               height: 24px;
               border-radius: 4px;
               background: rgba(0, 0, 0, 0.45);
               border: 1px solid var(--shadow);
               overflow: hidden;
           }

           .bar-fill {
               position: absolute;
               top: 0;
               left: 0;
               bottom: 0;
               transition: width 0.1s linear;
           }

           .bar-label, .bar-time {
               position: absolute;
               top: 0;
               bottom: 0;
               display: flex;
               align-items: center;
               font-weight: 700;
               color: var(--parchment);
               text-shadow: 0 1px 3px rgba(0,0,0,0.9);
               white-space: nowrap;
               z-index: 1;
           }

           .bar-label {
               left: 8px;
               right: 42px;
               overflow: hidden;
               text-overflow: ellipsis;
               font-family: "Cinzel", Georgia, serif;
               font-size: 12px;
               letter-spacing: 0.01em;
           }

           .bar-time {
               right: 8px;
               font-family: "Roboto Condensed", "Segoe UI", sans-serif;
               font-size: 13px;
               font-variant-numeric: tabular-nums;
           }
           /* Matches Cactbot's BarExpiresSoonSeconds - a bar about to run out gets a pulsing
        highlight so it's noticeable even out of the corner of your eye. */
           .bar.expiring-soon {
               animation: pulseSoon 0.6s ease-in-out infinite;
           }

           @keyframes pulseSoon {
               0%, 100% {
                   box-shadow: 0 0 0 rgba(201,154,60,0);
               }

               50% {
                   box-shadow: 0 0 8px 3px rgba(201,154,60,0.7);
               }
           }
           /* Deliberately faster and stronger than expiring-soon's brass glow - an overdue timer is
        more urgent than "about to expire", not the same level of attention. */
           .bar.overdue {
               animation: pulseOverdue 1.5s ease-in-out infinite;
           }

           @keyframes pulseOverdue {
               0%, 100% {
                   box-shadow: 0 0 0 rgba(255,65,54,0);
               }

               50% {
                   box-shadow: 0 0 10px 4px rgba(255,65,54,0.85);
               }
           }
    </style>
</head>
<body>
    <div id="panel"></div>

    <script src="common.js"></script>
    <script>
        const panelEl = document.getElementById('panel');
        const EXPIRES_SOON_SECONDS = 5; // matches Cactbot's own BarExpiresSoonSeconds concept
        const OVERDUE_LINGER_SECONDS = 5; // native ACT timers don't carry a linger setting - a short fixed grace period keeps an expired bar from vanishing mid-glance

        // ACT's own FillColor for a Spell Timer defaults to the same dark blue for basically
        // every timer unless someone's gone through and hand-picked a color for each one
        // individually in Options -> Spell Timers - which most people never do, so in practice
        // every bar here ends up identical and bland. Rather than trust ACT's raw color, each
        // timer name is hashed to a stable pick from this palette instead - all colors chosen to
        // sit alongside this project's own brass/parchment/rust/verdigris theme rather than
        // clashing with it. Stable per name (not re-randomized every render) so a given timer's
        // color doesn't flicker or change between its own Started/Warning/Expired updates.
        const TIMER_COLOR_PALETTE = [
            '#c99a3c', // brass
            '#6b8a7a', // verdigris
            '#a8462a', // rust
            '#7a8fc9', // steel blue
            '#a36bc9', // amethyst
            '#c9a36b', // ochre
            '#6bc9a3', // jade
            '#c96b8f', // dusty rose
        ];

        function colorForTimerName(name) {
            let hash = 0;
            for (let i = 0; i < name.length; i++) {
                hash = (hash * 31 + name.charCodeAt(i)) | 0;
            }
            return TIMER_COLOR_PALETTE[Math.abs(hash) % TIMER_COLOR_PALETTE.length];
        }

        // Keyed by ACT's own timer Name (unique per Spell Timers entry). ACT's own Spell Timers
        // window shows exactly one counting-down number per timer name - the master timer's own
        // remaining time - and completely ignores any other "renewal" entries stacked up
        // internally (see AlarmTimerBridge's comment on GetLargestVal). We mirror that here:
        // no xN count, no separate instance layer, just the one number ACT itself reports.
        const activeTimers = new Map();

        // Keyed by timer Name - reused across renders so the DOM doesn't get rebuilt from scratch
        // every tick, same pattern as dps-meter.html's rowElements.
        const barElements = new Map();

        // AlarmTimerBridge broadcasts this on Started/Warning/Expired, each carrying the same
        // shape. RemainingSeconds is ACT's own master-timer remaining time (GetLargestVal on the
        // master SpellTimer only), computed fresh by ACT itself every half-second tick - so we
        // just take it at face value and recompute our own expiresAt from it every time, rather
        // than trying to derive/guess a countdown from DurationSeconds. That's what previously
        // caused the bar to snap back to full duration and "stack" on every Started/Warning/
        // Expired event instead of counting down smoothly in sync with ACT.
        function onAlarmTimerUpdate(fired) {
            const now = Date.now();
            activeTimers.set(fired.name, {
                label: fired.name,
                color: colorForTimerName(fired.name),
                durationSeconds: fired.durationSeconds,
                expiresAt: now + fired.remainingSeconds * 1000,
            });
        }

        // ACT fires this when a timer is removed entirely (deleted from Spell Timers, not just
        // expired) - clear it immediately rather than waiting out the overdue linger.
        function onAlarmTimerRemoved(removed) {
            activeTimers.delete(removed.name);
        }

        let previewMode = false;

        // Called live by the WPF host via ExecuteScriptAsync (same mechanism as
        // window.setOverlayZoom), driven by a settings-tab checkbox. Without this, positioning the
        // overlay means either waiting for a real timer or knowing to use test.html - most people
        // wouldn't think to do either.
        window.setPreviewMode = function (enabled) {
            previewMode = enabled;
            renderBars();
        };

        function renderBars() {
            const now = Date.now();

            for (const [name, timer] of activeTimers) {
                if (now >= timer.expiresAt + OVERDUE_LINGER_SECONDS * 1000) activeTimers.delete(name);
            }

            // ACT already gives one entry per timer name - its own Spell Timers window shows a
            // single remaining-time number per name, with no grouping/stacking, so there's no
            // grouping step needed here either.
            let rows = [];
            for (const [name, timer] of activeTimers) {
                const remaining = (timer.expiresAt - now) / 1000;
                rows.push({
                    ruleName: name,
                    label: timer.label,
                    color: timer.color,
                    remaining,
                    duration: timer.durationSeconds,
                    overdue: remaining < 0,
                });
            }

            // Nothing running and not previewing - hide the panel entirely rather than leave an
            // empty bordered box floating over the game. watchContentSize's ResizeObserver picks
            // this up automatically and the WPF host shrinks to match, same as everywhere else.
            if (rows.length === 0 && !previewMode) {
                panelEl.style.display = 'none';
                return;
            }
            panelEl.style.display = 'flex';

            if (rows.length === 0 && previewMode) {
                rows = [
                    { ruleName: '__preview1', label: 'Example Timer', color: colorForTimerName('Example Timer'), remaining: 18.4, duration: 30, overdue: false },
                    { ruleName: '__preview2', label: 'Example Timer 2', color: colorForTimerName('Example Timer 2'), remaining: 7.2, duration: 20, overdue: false },
                    { ruleName: '__preview3', label: 'Overdue Example', color: colorForTimerName('Overdue Example'), remaining: -3.1, duration: 15, overdue: true },
                ];
            }

            // Soonest-expiring first. An overdue row's remaining is negative, so it naturally sorts
            // above everything still counting down - more urgent than "about to expire soon".
            rows.sort((a, b) => a.remaining - b.remaining);

            const seen = new Set();
            rows.forEach((row, index) => {
                seen.add(row.ruleName);
                let el = barElements.get(row.ruleName);
                if (!el) {
                    el = document.createElement('div');
                    el.className = 'bar';
                    el.innerHTML = `
              <div class="bar-fill"></div>
              <div class="bar-label"></div>
              <div class="bar-time"></div>`;
                    barElements.set(row.ruleName, el);
                }

                const pct = row.overdue ? 100 : Math.max(0, Math.min(100, (row.remaining / row.duration) * 100));
                el.querySelector('.bar-fill').style.width = pct + '%';
                el.querySelector('.bar-fill').style.background = row.overdue ? '#ff4136' : row.color;
                el.querySelector('.bar-label').textContent = row.label;
                el.querySelector('.bar-time').textContent = row.overdue
                    ? '+' + Math.abs(row.remaining).toFixed(1)
                    : row.remaining.toFixed(1);
                el.classList.toggle('expiring-soon', !row.overdue && row.remaining <= EXPIRES_SOON_SECONDS);
                el.classList.toggle('overdue', row.overdue);

                // Only touch the DOM if this element isn't already in the right slot - appendChild
                // (even re-appending the same node) removes and re-inserts it, which resets any CSS
                // animation on it. This runs every 100ms, far faster than the pulse animation
                // completes one cycle, so reordering unconditionally would reset the pulse constantly.
                if (panelEl.children[index] !== el) {
                    panelEl.insertBefore(el, panelEl.children[index] || null);
                }
            });

            for (const [ruleName, el] of barElements) {
                if (!seen.has(ruleName)) {
                    el.remove();
                    barElements.delete(ruleName);
                }
            }
        }

        function onClearTimers() {
            activeTimers.clear();
            renderBars();
        }

        watchContentSize();
        connectOverlay({ alarmTimerUpdate: onAlarmTimerUpdate, alarmTimerRemoved: onAlarmTimerRemoved, clearAlarmTimers: onClearTimers });
        setInterval(renderBars, 100);
    </script>
</body>
</html>
